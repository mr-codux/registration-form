<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg"/
  <link href="./asset/css/output.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="w-full h-[100vh] m-[0] bg-[#1b1b32] text-[#f5f6f7]">
  <div class="flex items-center justify-center flex-col gap-0.5">
     <h1 class="my-4 mx-auto text-center text-2">Registration Form</h1>
     <p clas="text-1 text-center">Please fill out this form with the required information</p>
  </div>

  <form class="w-full md:w-[60vw] min-w-[300px] mx-auto max-w-sm md:max-w-lg pb-4 md:pb-8">
    <!-- fieldset one -->
    <fieldset class="border-none py-4 md:py-8 border-b-3 border-[#3b3b4f] last-of-type:border-b-0">
        <label  class="block my-1 md:my-2" for="first-name">Enter Your First Name: <input class="mt-1 md:mt-2.5 w-full min-h-[2rem] bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="first-name" name="first-name" type="text"
            required />
        </label>
        <label  class="block my-1 md:my-2" for="last-name">Enter Your Last Name: <input class="mt-1 md:mt-2.5 w-full min-h-[2rem] bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="last-name" name="last-name" type="text"
            required />
        </label>
        <label  class="block my-1 md:my-2" for="email">Enter Your Email: <input class="mt-1 md:mt-2.5 w-full min-h-[2rem] bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="email" name="email" type="email" required />
        </label>
        <label  class="block my-1 md:my-2" for="new-password">Create a New Password: <input class="mt-1 md:mt-2.5 w-full min-h-[2rem] bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="new-password" name="new-password" type="password"
            pattern="[a-z0-9]{8,}" required />
        </label>
    </fieldset>
    <!-- fieldset two -->
    <fieldset class="border-none py-4 md:py-8 border-b-3 border-[#3b3b4f] last-of-type:border-b-0>
      <label  class="block my-1 md:my-2" for="personal-account"><input  class="mt-1 md:mt-2.5 w-full min-h-[2rem] bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="personal-account" type="radio" name="account-type" class="inline" />
        Personal Account
      </label>
      <label  class="block my-1 md:my-2" for="business-account"><input  class="mt-1 md:mt-2.5 w-full min-h-[2rem] bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="business-account" type="radio" name="account-type" class="inline" />
        Business Account
      </label>
      <label  class="block my-1 md:my-2" for="terms-and-conditions">
        <input  class="mt-1 md:mt-2.5 w-full min-h-[2rem] bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="terms-and-conditions" type="checkbox" required name="terms-and-conditions" class="inline" /> I accept
        the <a href="https://www.freecodecamp.org/news/terms-of-service/">terms and conditions</a>
      </label>
    </fieldset>
    <!-- fieldset three -->
    <fieldset class="border-none py-4 md:py-8 border-b-3 border-[#3b3b4f] last-of-type:border-b-0>
      <label  class="block my-1 md:my-2" for="profile-picture">Upload a profile picture: <input class="mt-1 md:mt-2.5 w-full min-h-[2rem] bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="profile-picture" type="file"
          name="file" />
      </label>
      <label class="block my-1 md:my-2" for="age">Input your age (years): <input  class="mt-1 md:mt-2.5 w-full min-h-[2rem] bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="age" type="number" name="age" min="13" max="120" />
      </label>
      <label class="block my-1 md:my-2" for="referrer">How did you hear about us?
        <select class="mt-1 md:mt-2.5 w-full min-h-[2rem]" id="referrer" name="referrer">
          <option value="">(select one)</option>
          <option value="1">freeCodeCamp News</option>
          <option value="2">freeCodeCamp YouTube Channel</option>
          <option value="3">freeCodeCamp Forum</option>
          <option value="4">Other</option>
        </select>
      </label>
      <label class="block my-1 md:my-2" for="bio">Provide a bio:
        <textarea class="mt-1 md:mt-2.5 w-full min-h-[2rem] bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="bio" name="bio" rows="3" cols="30" placeholder="I like coding on the beach..."></textarea>
      </label>
    </fieldset>
    <!-- submit button -->
    <input class="mt-1 md:mt-2.5 w-full min-h-[2rem]" type="submit" value="Submit" />
  </form>
</body>
</html>
