<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- <link rel="icon" type="image/svg+xml" href="asset/images/favicon.svg" /> -->
  <link href="./asset/css/output.css" rel="stylesheet">
  <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
  <div class="flex flex-col items-center justify-center min-h-screen bg-[#1b1b32]">
  <div class="flex items-center justify-center flex-col">
    <h1 class="text-center text-[2rem] text-white">Registration Form</h1>
    <p class="text-[10px] text-center text-white">Please fill out this form with the required information</p>
  </div>

  <form class="flex flex-col items-center justify-center w-full md:w-[60vw] min-w-[300px]">
    <!-- fieldset one -->
    <fieldset class="flex flex-col items-center justify-center border-none py-4 md:py-8 border-b-3 border-[#3b3b4f] last-of-type:border-b-0">
        <label  class="" for="first-name">Enter Your First Name: <input class="bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="first-name" name="first-name" type="text"
            required />
        </label>
        <label  class="" for="last-name">Enter Your Last Name: <input class="bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="last-name" name="last-name" type="text"
            required />
        </label>
        <label  class="" for="email">Enter Your Email: <input class="bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="email" name="email" type="email" required />
        </label>
        <label  class="" for="new-password">Create a New Password: <input class="bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="new-password" name="new-password" type="password"
            pattern="[a-z0-9]{8,}" required />
        </label>
    </fieldset>
    <!-- fieldset two -->
    <fieldset class="flex flex-col items-center justify-center last-of-type:border-b-0">
      <label  class="" for="personal-account"><input  class="bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="personal-account" type="radio" name="account-type" class="inline" />
        Personal Account
      </label>
      <label  class="" for="business-account"><input  class="bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="business-account" type="radio" name="account-type" class="inline" />
        Business Account
      </label>
      <label  class="" for="terms-and-conditions">
        <input  class="bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="terms-and-conditions" type="checkbox" required name="terms-and-conditions" class="inline" /> I accept
        the <a href="https://www.freecodecamp.org/news/terms-of-service/">terms and conditions</a>
      </label>
    </fieldset>
    <!-- fieldset three -->
    <fieldset class="flex flex-col items-center justify-center border-b-3 border-[#3b3b4f] last-of-type:border-b-0">
      <label  class="" for="profile-picture">Upload a profile picture: <input class="bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="profile-picture" type="file"
          name="file" />
      </label>
      <label class="" for="age">Input your age (years): <input  class="bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="age" type="number" name="age" min="13" max="120" />
      </label>
      <label class="" for="referrer">How did you hear about us?
        <select class=" w-full min-h-[2rem]" id="referrer" name="referrer">
          <option value="">(select one)</option>
          <option value="1">freeCodeCamp News</option>
          <option value="2">freeCodeCamp YouTube Channel</option>
          <option value="3">freeCodeCamp Forum</option>
          <option value="4">Other</option>
        </select>
      </label>
      <label class="" for="bio">Provide a bio:
        <textarea class="bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" id="bio" name="bio" rows="3" cols="30" placeholder="I like coding on the beach..."></textarea>
      </label>
    </fieldset>
    <!-- submit button -->
    <input class="w-full min-h-[2rem] bg-[#0a0a23] border-[1px] border-[#ffffff] text-white" type="submit" value="Submit" />
  </form>
  </div>
</body>
</html>
